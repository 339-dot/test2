<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多链授权工具 (WC v2)</title>

    <!-- 引入 WalletConnect v2 & Ethers.js -->
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.14.0/dist/browser/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI"; padding: 20px; max-width: 520px; margin: auto; background: #f5f5f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; text-align: center; }
        select, input { width: 100%; margin: 8px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-connect { background: #007bff; color: white; }
        .btn-approve { background: #28a745; color: white; }
        .btn-revoke { background: #dc3545; color: white; }
        #status { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; word-break: break-all; min-height: 40px; }
        .status-info { background: #e3f2fd; color: #1976d2; }
        .status-ok { background: #e8f5e9; color: #388e3c; }
        .status-error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔐 多链授权管理</h2>

    <!-- 链选择 -->
    <select id="chainSelect">
        <option value="137">Polygon (PoS)</option>
        <option value="6714">Anubis</option>
    </select>

    <!-- 合约信息输入 -->
    <input id="token" placeholder="Token 合约地址" />
    <input id="spender" placeholder="Spender 合约地址" />
    <input id="amount" placeholder="授权数量（代币）" />
    <input id="decimals" placeholder="代币精度（默认 18）" value="18" />

    <!-- 操作按钮 -->
    <button class="btn-connect" onclick="connect()">📱 连接钱包 (WC v2)</button>
    <button class="btn-approve" onclick="approve()">✅ 授权</button>
    <button class="btn-revoke" onclick="revoke()">❌ 撤销授权</button>

    <!-- 状态显示 -->
    <div id="status">请连接钱包</div>
</div>

<script>
let provider, signer;

// 1. 配置 WalletConnect v2 (EthereumProvider)
const wcProvider = EthereumProvider.init({
    projectId: "77178381f2226c9628ad5faf8ba32c10", // 你的 Project ID
    chains: [137, 6714], // 必选链
    optionalChains: [137, 6714], // 可选链
    rpcMap: {
        137: "https://polygon-rpc.com",
        6714: "https://rpc2.anubispace.org"
    },
    showQrModal: true // 显示二维码弹窗
});

const statusDiv = document.getElementById('status');

// 2. 连接钱包
async function connect() {
    try {
        statusDiv.className = 'status-info';
        statusDiv.innerText = '正在连接 WalletConnect...';

        await wcProvider.connect();
        
        provider = new ethers.providers.Web3Provider(wcProvider);
        signer = provider.getSigner();
        const address = await signer.getAddress();
        const network = await provider.getNetwork();

        statusDiv.className = 'status-ok';
        statusDiv.innerText = `✅ 连接成功!\n地址: ${address}\n链ID: ${network.chainId}`;

        // 监听链变化
        wcProvider.on("chainChanged", (chainId) => {
            statusDiv.innerText = `链已切换至: ${chainId}`;
        });

    } catch (error) {
        console.error(error);
        statusDiv.className = 'status-error';
        statusDiv.innerText = `❌ 连接失败: ${error.message}`;
    }
}

// 3. 通用合约实例
function getContract() {
    if (!signer) {
        alert("请先连接钱包！");
        throw new Error("Wallet not connected");
    }
    const abi = ["function approve(address spender, uint256 amount) external returns (bool)"];
    return new ethers.Contract(document.getElementById('token').value, abi, signer);
}

// 4. 授权
async function approve() {
    try {
        const contract = getContract();
        const amount = ethers.utils.parseUnits(
            document.getElementById('amount').value,
            document.getElementById('decimals').value
        );
        const tx = await contract.approve(document.getElementById('spender').value, amount);
        statusDiv.innerText = `授权交易中...\nHash: ${tx.hash}`;
        await tx.wait();
        statusDiv.className = 'status-ok';
        statusDiv.innerText = '✅ 授权成功!';
    } catch (e) {
        statusDiv.className = 'status-error';
        statusDiv.innerText = `❌ 授权失败: ${e.message}`;
    }
}

// 5. 撤销授权 (发送 0)
async function revoke() {
    try {
        const contract = getContract();
        const zero = ethers.utils.parseUnits("0", document.getElementById('decimals').value);
        const tx = await contract.approve(document.getElementById('spender').value, zero);
        statusDiv.innerText = `撤销交易中...\nHash: ${tx.hash}`;
        await tx.wait();
        statusDiv.className = 'status-ok';
        statusDiv.innerText = '✅ 撤销成功!';
    } catch (e) {
        statusDiv.className = 'status-error';
        statusDiv.innerText = `❌ 撤销失败: ${e.message}`;
    }
}
</script>

</body>
</html>
