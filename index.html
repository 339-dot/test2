<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Direct</title>
  <meta name="application-name" content="Direct" />
  <meta property="og:site_name" content="Direct" />
  <script>
    (() => {
      document.title = "Direct";
      document.querySelector('meta[name="application-name"]')?.setAttribute("content", "Direct");
      document.querySelector('meta[property="og:site_name"]')?.setAttribute("content", "Direct");
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js" onerror="window.ethersLoadFailed = true"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #eef3f7;
      --ink: #172033;
      --muted: #667085;
      --line: #d8e0e8;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #168653;
      --amber: #b86e12;
      --coral: #d95e40;
      --danger: #b42318;
      --shadow: 0 16px 38px rgba(23, 32, 51, 0.08);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(246, 248, 251, 0.9)),
        repeating-linear-gradient(90deg, rgba(37, 99, 235, 0.05) 0, rgba(37, 99, 235, 0.05) 1px, transparent 1px, transparent 72px),
        var(--bg);
      color: var(--ink);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      min-height: 40px;
      padding: 0 14px;
      background: var(--surface-2);
      color: var(--ink);
      font-weight: 650;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(23, 32, 51, 0.1);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .success {
      background: var(--green);
      color: white;
    }

    .warn {
      background: #fff2d6;
      color: #7a4700;
    }

    .danger {
      background: #fee4e2;
      color: var(--danger);
    }

    .ghost {
      background: transparent;
      border: 1px solid var(--line);
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
      min-height: 42px;
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(37, 99, 235, 0.7);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 18px clamp(16px, 3vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2563eb, #168653 56%, #d95e40);
      color: white;
      font-weight: 850;
      letter-spacing: 0;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.2vw, 31px);
      letter-spacing: 0;
      line-height: 1.05;
    }

    .brand-meta {
      margin-top: 5px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      max-width: 100%;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      flex: 0 0 auto;
    }

    .dot.ok {
      background: var(--green);
    }

    .dot.bad {
      background: var(--danger);
    }

    .wallet-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .workspace {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: clamp(16px, 3vw, 28px);
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(180deg, #fff, #f9fbfd);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: #344054;
      font-size: 13px;
      font-weight: 720;
    }

    .row {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .row > * {
      min-width: 0;
    }

    .row button {
      flex: 0 0 auto;
    }

    .rpc-preset {
      flex: 0 0 160px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 126px minmax(0, 1fr);
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--line);
    }

    .detail-grid div {
      background: white;
      padding: 9px 10px;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .detail-grid .key {
      color: #475467;
      font-weight: 700;
      background: #f7f9fb;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      background: #f7f9fb;
    }

    .tab {
      border-radius: 0;
      background: transparent;
      border-right: 1px solid var(--line);
      min-height: 46px;
      color: var(--muted);
    }

    .tab.active {
      color: var(--ink);
      background: #fff;
      box-shadow: inset 0 -3px 0 var(--blue);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .function-list {
      display: grid;
      gap: 12px;
      padding-bottom: min(65vh, 520px);
    }

    .function-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .function-item.original-call {
      border-color: rgba(217, 94, 64, 0.78);
      box-shadow: 0 0 0 3px rgba(217, 94, 64, 0.12);
    }

    .function-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      background: #fbfcfe;
      border-bottom: 1px solid var(--line);
    }

    .function-name {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-weight: 800;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .function-kind {
      font-size: 12px;
      font-weight: 800;
      color: var(--green);
      background: #e8f6ef;
      border-radius: 999px;
      padding: 4px 8px;
      flex: 0 0 auto;
    }

    .function-kind.write {
      color: #7a4700;
      background: #fff2d6;
    }

    .function-kind.origin {
      color: white;
      background: var(--coral);
    }

    .function-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .params {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .param-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #475467;
      font-size: 12px;
      font-weight: 700;
    }

    .param-label span:last-child {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .result {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101828;
      color: #e4e7ec;
      padding: 11px;
      min-height: 46px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .status-line {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      background: #fff;
      border-radius: 8px;
      padding: 11px 12px;
      color: #344054;
      font-size: 13px;
      line-height: 1.45;
    }

    .status-line.warn {
      border-left-color: var(--amber);
      background: #fffaf0;
    }

    .status-line.good {
      border-left-color: var(--green);
      background: #f0fdf4;
    }

    .status-line.bad {
      border-left-color: var(--danger);
      background: #fff5f4;
    }

    .empty {
      border: 1px dashed #b8c4d0;
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
      background: #fbfcfe;
      text-align: center;
      font-size: 14px;
    }

    .hint-list {
      display: grid;
      gap: 8px;
    }

    .hint-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      overflow-wrap: anywhere;
    }

    .hint-item strong {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 1020px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .wallet-actions {
        width: 100%;
        justify-content: flex-start;
      }
    }

    @media (max-width: 640px) {
      .row,
      .split {
        display: grid;
        grid-template-columns: 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-grid .key {
        padding-bottom: 3px;
      }

      .tabs {
        overflow-x: auto;
      }

      .tab {
        flex: 1 0 auto;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="appMark" aria-hidden="true">P</div>
        <div>
          <h1 id="appTitle">Polygon</h1>
          <div class="brand-meta">
            <span class="chip"><span class="dot" id="rpcDot"></span><span id="rpcState">RPC 待连接</span></span>
            <span class="chip"><span class="dot" id="walletDot"></span><span id="walletState">钱包未连接</span></span>
          </div>
        </div>
      </div>
      <div class="wallet-actions">
        <select id="walletSelect" aria-label="钱包选择">
          <option value="">检测钱包...</option>
        </select>
        <button class="ghost" id="networkModeBtn">切换网络：当前 Polygon</button>
        <button class="ghost" id="resetPageBtn">清除</button>
        <button class="ghost" id="disconnectWalletBtn" disabled>断开钱包</button>
        <button class="primary" id="connectWalletBtn">连接钱包</button>
      </div>
    </header>

    <main class="workspace">
      <div class="stack">
        <section class="panel">
          <div class="panel-header">
            <h2>交易哈希</h2>
            <a id="scanTxLink" href="#" target="_blank" rel="noopener" hidden>Polygonscan</a>
          </div>
          <div class="panel-body">
            <div class="field">
              <label for="txHash">Hash</label>
              <div class="row">
                <input id="txHash" class="mono" spellcheck="false" autocomplete="off" placeholder="0x..." />
                <button class="primary" id="loadTxBtn">解析</button>
              </div>
            </div>
            <div class="field">
              <label id="rpcLabel" for="rpcUrl">Polygon RPC</label>
              <div class="row">
                <select id="rpcPreset" class="rpc-preset" aria-label="RPC 预设">
                  <option value="https://polygon-bor-rpc.publicnode.com">PublicNode</option>
                  <option value="https://polygon.drpc.org">dRPC</option>
                  <option value="https://1rpc.io/matic">1RPC</option>
                  <option value="custom">自定义</option>
                </select>
                <input id="rpcUrl" spellcheck="false" value="https://polygon-bor-rpc.publicnode.com" />
              </div>
            </div>
            <div class="detail-grid" id="txDetails">
              <div class="key">状态</div><div>等待交易哈希</div>
              <div class="key">交互地址</div><div>-</div>
              <div class="key">From</div><div>-</div>
              <div class="key">Value</div><div>-</div>
              <div class="key">Block</div><div>-</div>
              <div class="key">Selector</div><div>-</div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>交互地址</h2>
            <button class="ghost" id="copyTargetBtn">复制</button>
          </div>
          <div class="panel-body">
            <div class="field">
              <label for="targetAddress">Address</label>
              <input id="targetAddress" class="mono" spellcheck="false" autocomplete="off" placeholder="0x..." />
            </div>
            <div class="row">
              <button id="applyTargetBtn">应用地址</button>
              <button class="ghost" id="checkCodeBtn">检查合约</button>
            </div>
            <div class="status-line" id="targetStatus">等待地址</div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>ABI</h2>
            <span class="chip" id="abiCount">0 functions</span>
          </div>
          <div class="panel-body">
            <div class="field">
              <label id="scanApiKeyLabel" for="scanApiKey">Polygonscan / Etherscan API Key</label>
              <input id="scanApiKey" spellcheck="false" autocomplete="off" placeholder="可选" />
            </div>
            <div class="row">
              <button class="primary" id="loadVerifiedAbiBtn">载入已验证 ABI</button>
              <button class="ghost" id="clearAbiBtn">清空 ABI</button>
            </div>
            <div class="field">
              <label for="abiInput">ABI JSON</label>
              <textarea id="abiInput" spellcheck="false" placeholder='[{"type":"function","name":"balanceOf","inputs":[...]}]'></textarea>
            </div>
            <button class="success" id="useAbiBtn">应用 ABI</button>
            <div class="status-line" id="abiStatus">等待 ABI</div>
          </div>
        </section>
      </div>

      <div class="stack">
        <section class="panel">
          <div class="panel-header">
            <h2>建议操作</h2>
            <span class="chip" id="advisorState">待识别</span>
          </div>
          <div class="panel-body">
            <div class="row">
              <button class="primary" id="smartDetectBtn">智能识别调用</button>
              <button class="ghost" id="lookupSelectorBtn">查询函数签名</button>
               <button class="ghost" id="diagnoseSwapBtn">检查余额/授权</button>
            </div>
            <div class="split">
              <div class="field">
                <label for="simpleAmount">输入数量</label>
                <input id="simpleAmount" inputmode="decimal" placeholder="例如 8.88" />
              </div>
              <div class="field">
                <label for="simpleSlippage">滑点保护</label>
                <select id="simpleSlippage">
                  <option value="500">5% 常规</option>
                  <option value="1000" selected>10% 带税币</option>
                  <option value="2000">20% 更容易成交</option>
                  <option value="5000">50% 仅测试估算</option>
                  <option value="custom">自定义</option>
                </select>
                <input id="customSlippage" inputmode="decimal" placeholder="自定义滑点%，例如 12.5" hidden />
              </div>
            </div>
            <div class="row">
              <button class="success" id="buildSimpleSwapBtn">只按这个数量自动配置</button>
              <button class="ghost" id="estimateSimpleSwapBtn">自动配置并估算</button>
            </div>
            <div class="result" id="simpleSwapResult">-</div>
            <div class="status-line" id="advisorStatus">等待交易哈希</div>
            <div class="hint-list" id="signatureHints"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>授权管理</h2>
            <span class="chip" id="approvalState">待检查</span>
          </div>
          <div class="panel-body">
            <div class="field">
              <label for="approvalToken">Token 地址</label>
              <input id="approvalToken" class="mono" spellcheck="false" autocomplete="off" placeholder="0x..." />
            </div>
            <div class="field">
              <label for="approvalSpender">授权对象</label>
              <input id="approvalSpender" class="mono" spellcheck="false" autocomplete="off" placeholder="0x..." />
            </div>
            <div class="split">
              <div class="field">
                <label for="approvalAmount">授权数量</label>
                <input id="approvalAmount" inputmode="decimal" placeholder="例如 1.5" />
              </div>
              <div class="field">
                <label for="approvalDecimals">精度</label>
                <input id="approvalDecimals" inputmode="numeric" placeholder="自动" />
              </div>
            </div>
            <div class="row">
              <button class="ghost" id="fillApprovalFromSwapBtn">填入当前 Swap</button>
              <button class="ghost" id="checkApprovalBtn">检查授权</button>
              <button class="primary" id="approveTokenBtn">授权</button>
              <button class="danger" id="revokeTokenBtn">取消授权</button>
            </div>
            <div class="result" id="approvalResult">-</div>
          </div>
        </section>

        <section class="panel">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="readPanel" role="tab">读取函数</button>
            <button class="tab" data-tab="writePanel" role="tab">写入函数</button>
            <button class="tab" data-tab="rawPanel" role="tab">Raw calldata</button>
          </div>
          <div class="tab-panel active" id="readPanel">
            <div class="panel-body">
              <div class="function-list" id="readFunctions">
                <div class="empty">等待 ABI</div>
              </div>
            </div>
          </div>
          <div class="tab-panel" id="writePanel">
            <div class="panel-body">
              <div class="function-list" id="writeFunctions">
                <div class="empty">等待 ABI</div>
              </div>
            </div>
          </div>
          <div class="tab-panel" id="rawPanel">
            <div class="panel-body">
              <div class="split">
                <div class="field">
                  <label id="nativeValueLabel" for="rawValue">MATIC</label>
                  <input id="rawValue" inputmode="decimal" placeholder="0" />
                </div>
                <div class="field">
                  <label for="rawGas">Gas limit</label>
                  <input id="rawGas" inputmode="numeric" placeholder="自动" />
                </div>
              </div>
              <div class="field">
                <label for="rawData">Calldata</label>
                <textarea id="rawData" spellcheck="false" placeholder="0x"></textarea>
              </div>
              <div class="row">
                <button class="ghost" id="estimateRawBtn">估算</button>
                <button class="danger" id="sendRawBtn">发送</button>
              </div>
              <div class="result" id="rawResult">-</div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>交易解码</h2>
            <span class="chip" id="decodeState">未解码</span>
          </div>
          <div class="panel-body">
            <div class="result" id="decodeResult">-</div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>状态</h2>
          </div>
          <div class="panel-body">
            <div class="status-line" id="mainStatus">准备就绪</div>
            <div class="result" id="lastResult">-</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const els = {
      appMark: document.getElementById("appMark"),
      appTitle: document.getElementById("appTitle"),
      txHash: document.getElementById("txHash"),
      networkModeBtn: document.getElementById("networkModeBtn"),
      rpcLabel: document.getElementById("rpcLabel"),
      rpcPreset: document.getElementById("rpcPreset"),
      rpcUrl: document.getElementById("rpcUrl"),

    function walletLabel(provider, fallback = "Injected Wallet") {
      if (provider?.isOkxWallet || provider?.isOKExWallet) return "OKX Wallet";
      if (provider?.isTokenPocket || provider?.isTpWallet || provider?.isTP) return "TokenPocket";
      if (provider?.isBinance || provider?.isBinanceWallet) return "Binance Wallet";
      if (provider?.isBitKeep || provider?.isBitget || provider?.isBitgetWallet) return "Bitget Wallet";
      if (provider?.isMetaMask) return "MetaMask";
      if (provider?.isRabby) return "Rabby";
      if (provider?.isCoinbaseWallet) return "Coinbase Wallet";
      if (provider?.isTrust) return "Trust Wallet";
      return fallback;
    }

    function normalizedWalletName(name) {
      return String(name || "Injected Wallet").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function isOkxWallet(wallet) {
      return wallet?.provider?.isOkxWallet
        || wallet?.provider?.isOKExWallet
        || normalizedWalletName(wallet?.name).includes("okx")
        || normalizedWalletName(wallet?.name).includes("okex");
    }

    function walletPriority(wallet) {
      const name = normalizedWalletName(wallet?.name);
      if (isOkxWallet(wallet)) return 0;
      if (wallet?.provider?.isTokenPocket || wallet?.provider?.isTpWallet || name.includes("tokenpocket")) return 1;
      if (wallet?.provider?.isBinance || wallet?.provider?.isBinanceWallet || name.includes("binance")) return 2;
      if (wallet?.provider?.isBitKeep || wallet?.provider?.isBitget || name.includes("bitget") || name.includes("bitkeep")) return 3;
      return 10;
    }

    function preferredWalletId() {
      return [...state.wallets].sort((a, b) => walletPriority(a) - walletPriority(b))[0]?.id || "";
    }

    function addWalletProvider(id, name, provider) {
      const displayName = name || walletLabel(provider);
      const normalizedName = normalizedWalletName(displayName);
      if (!provider) return;
      if (state.wallets.some((wallet) => wallet.provider === provider || wallet.id === id || wallet.normalizedName === normalizedName)) return;
      state.wallets.push({ id, name: displayName, normalizedName, provider });
      renderWalletOptions();
    }

    function renderWalletOptions() {
      if (!state.wallets.length) {
        els.walletSelect.innerHTML = `<option value="">未检测到钱包</option>`;

      state.wallets.sort((a, b) => walletPriority(a) - walletPriority(b));

      if (!current || deprecated.has(current)) {

        return network.defaultRpc;

      syncRpcPreset();
      return els.rpcUrl.value.trim();

    function validateHash(value) {
      const hash = value.trim();
      if (!/^0x[a-fA-F0-9]{64}$/.test(hash)) throw new Error("交易哈希格式无效。");

    }

    function formatEtherValue(value) {
      const { ethers } = requireEthers();
      return `${ethers.formatEther(value || 0n)} ${currentNetwork().nativeCurrency.symbol}`;
    }

    function normalizeValue(value) {
      if (typeof value === "bigint") return value.toString();
      if (Array.isArray(value)) return value.map(normalizeValue);
      if (value && typeof value === "object") {
        if (value.constructor && value.constructor.name === "Result") {
          return Array.from(value).map(normalizeValue);
        }
        const entries = Object.entries(value).filter(([key]) => Number.isNaN(Number(key)));
        if (entries.length === 0 && typeof value.toString === "function") return value.toString();
        return Object.fromEntries(entries.map(([key, val]) => [key, normalizeValue(val)]));
      }
      return value;
    }

    function stringifyValue(value) {
      if (typeof value === "string") return value;
      return JSON.stringify(normalizeValue(value), null, 2);
    }

    function short(value) {

    async function loadTransaction() {
      try {
        requireEthers();
        setMain("正在解析交易...", "");
        els.loadTxBtn.disabled = true;
        const hash = validateHash(els.txHash.value);
        const rpc = provider();
        const [tx, receipt] = await Promise.all([
          rpc.getTransaction(hash),
          rpc.getTransactionReceipt(hash)
        ]);

        if (!tx) throw new Error(`没有在 ${currentNetwork().name} RPC 上找到这笔交易。`);

        state.tx = tx;
        state.receipt = receipt;
        const target = tx.to || receipt?.contractAddress || "";
        if (target) {
          state.target = validateAddress(target);
          els.targetAddress.value = state.target;
          await checkTargetCode(false);
        }

        const selector = tx.data && tx.data !== "0x" ? tx.data.slice(0, 10) : "无";
        const status = receipt ? (receipt.status === 1 ? "成功" : "失败") : "Pending";
        const block = receipt?.blockNumber ? String(receipt.blockNumber) : "-";
        const gasUsed = receipt?.gasUsed ? receipt.gasUsed.toString() : "-";
        txDetailRows([
          ["状态", esc(status)],
          ["交互地址", target ? `<span class="mono">${esc(target)}</span>` : "-"],
          ["From", `<span class="mono">${esc(tx.from)}</span>`],
          ["Value", esc(formatEtherValue(tx.value))],
          ["Block", esc(block)],
          ["Gas used", esc(gasUsed)],
          ["Selector", `<span class="mono">${esc(selector)}</span>`]
        ]);

        els.rawData.value = tx.data || "0x";
        els.rawValue.value = tx.value ? window.ethers.formatEther(tx.value) : "0";
        els.scanTxLink.href = explorerTxUrl(hash);
        els.scanTxLink.hidden = false;
        els.rpcDot.classList.add("ok");
        els.rpcState.textContent = "RPC 已连接";
        setMain("交易已解析。", "good");
        const nextMessage = tx.data && tx.data !== "0x"
          ? `已识别 selector ${selector}，可以继续智能识别 ABI 和函数。`
          : "这笔交易没有 calldata，通常是普通转账或无参数调用。";
        setAdvisor(nextMessage, tx.data && tx.data !== "0x" ? "" : "warn", "已解析");
        decodeTransaction();
      } catch (error) {
        setMain(error.message, "bad");
        setAdvisor(error.message, "bad", "解析失败");
        setLast({ error: error.message });
      } finally {
        els.loadTxBtn.disabled = false;
      }
    }

    async function applyTarget() {
      try {
        state.target = validateAddress(els.targetAddress.value.trim());
        els.targetAddress.value = state.target;
        setStatus(els.targetStatus, `已应用 ${state.target}`, "good");
        await checkTargetCode(false);
      } catch (error) {
        setStatus(els.targetStatus, error.message, "bad");
      }
    }

    async function checkTargetCode(report = true) {
      try {
        requireEthers();
        const address = validateAddress(els.targetAddress.value.trim() || state.target);
        const code = await provider().getCode(address);
        state.target = address;
        if (code && code !== "0x") {
          setStatus(els.targetStatus, `合约地址，bytecode ${Math.max(0, (code.length - 2) / 2)} bytes`, "good");
        } else {
          setStatus(els.targetStatus, "外部账户地址，ABI 函数不可用；Raw calldata 仍可发送。", "warn");
        }
        if (report) setMain("地址检查完成。", "good");
      } catch (error) {
        setStatus(els.targetStatus, error.message, "bad");
        if (report) setMain(error.message, "bad");
      }
    }

    function normalizeAbiPayload(payload) {
      if (Array.isArray(payload)) return payload;
      if (payload && Array.isArray(payload.abi)) return payload.abi;
      if (payload && payload.output && Array.isArray(payload.output.abi)) return payload.output.abi;
      throw new Error("ABI JSON 格式无效。");
    }

    function useAbiPayload(payload, sourceLabel) {
      const { ethers } = requireEthers();
      const abi = normalizeAbiPayload(payload);
      const iface = new ethers.Interface(abi);
      const fragments = iface.fragments.filter((fragment) => fragment.type === "function");
      state.abi = abi;
      state.abiSource = sourceLabel;
      state.abiIsRouterMinimal = false;
      state.iface = iface;
      state.fragments = fragments;
      els.abiInput.value = JSON.stringify(abi, null, 2);
      els.abiCount.textContent = `${fragments.length} functions`;
      setStatus(els.abiStatus, `${sourceLabel} 已应用。`, "good");
      renderFunctions();
      decodeTransaction();
    }

    async function loadVerifiedAbi() {
      try {
        requireEthers();
        if (!state.target) await applyTarget();
        const address = validateAddress(state.target || els.targetAddress.value.trim());
        setStatus(els.abiStatus, "正在载入 ABI...", "");
        els.loadVerifiedAbiBtn.disabled = true;
        const key = els.scanApiKey.value.trim();
        const network = currentNetwork();
        const urls = [
          {
            label: "Sourcify full match",
            url: `https://repo.sourcify.dev/contracts/full_match/${network.sourcifyChainId}/${address}/metadata.json`,
            parse: async (response) => {
              if (!response.ok) throw new Error("no full match");
              const data = await response.json();
              return data.output?.abi;
            }
          },
          {
            label: "Sourcify partial match",
            url: `https://repo.sourcify.dev/contracts/partial_match/${network.sourcifyChainId}/${address}/metadata.json`,
            parse: async (response) => {
              if (!response.ok) throw new Error("no partial match");
              const data = await response.json();
              return data.output?.abi;
            }
          },
          {
            label: "Etherscan v2",
            url: key && network.etherscanChainId ? `https://api.etherscan.io/v2/api?chainid=${network.etherscanChainId}&module=contract&action=getabi&address=${address}&apikey=${encodeURIComponent(key)}` : "",
            parse: async (response) => {
              const data = await response.json();
              if (data.status !== "1") throw new Error(data.result || data.message || "Etherscan v2 failed");
              return JSON.parse(data.result);
            }
          },
          {
            label: network.explorerName,
            url: network.scanApiUrl ? `${network.scanApiUrl}?module=contract&action=getabi&address=${address}${key ? `&apikey=${encodeURIComponent(key)}` : ""}` : "",
            parse: async (response) => {
              const data = await response.json();
              if (data.status !== "1") throw new Error(data.result || data.message || `${network.explorerName} failed`);
              return JSON.parse(data.result);
            }
          }
        ].filter((item) => item.url);

        const errors = [];
        for (const item of urls) {
          try {
            const response = await fetch(item.url);
            const abi = await item.parse(response);
            if (Array.isArray(abi)) {
              useAbiPayload(abi, item.label);
              setMain("ABI 已载入。", "good");
              return true;
            }
            throw new Error("ABI 为空");
          } catch (error) {
            errors.push(`${item.label}: ${error.message}`);
          }
        }

        throw new Error(`未找到已验证 ABI。${errors.join(" | ")}`);
      } catch (error) {
        setStatus(els.abiStatus, error.message, "bad");
        setMain(error.message, "bad");
        return false;
      } finally {
        els.loadVerifiedAbiBtn.disabled = false;
      }
    }

    function clearAbi() {
      state.abi = null;
      state.abiSource = "";
      state.abiIsRouterMinimal = false;
      state.iface = null;
      state.fragments = [];
      state.decodedSignature = "";
      state.decodedArgs = null;
      els.abiInput.value = "";
      els.abiCount.textContent = "0 functions";
      els.decodeState.textContent = "未解码";
      els.decodeResult.textContent = "-";
      els.signatureHints.innerHTML = "";
      setAdvisor("ABI 已清空。", "warn", "待识别");
      setStatus(els.abiStatus, "ABI 已清空。", "warn");
      renderFunctions();
    }

    function usePastedAbi() {
      try {
        const text = els.abiInput.value.trim();
        if (!text) throw new Error("请粘贴 ABI JSON。");
        useAbiPayload(JSON.parse(text), "手动 ABI");
        setMain("ABI 已应用。", "good");
      } catch (error) {
        setStatus(els.abiStatus, error.message, "bad");
        setMain(error.message, "bad");
      }
    }

    function functionRenderKey(fragments = state.fragments, decodedSignature = state.decodedSignature) {
      return `${decodedSignature}|${fragments.map((fragment) => `${fragment.format("sighash")}:${fragment.stateMutability}`).join(";")}`;
    }

    function renderFunctionHtml(fragments, decodedSignature = state.decodedSignature) {
      const previousFragments = state.fragments;
      const previousDecodedSignature = state.decodedSignature;
      state.fragments = fragments;
      state.decodedSignature = decodedSignature;
      try {
        const reads = fragments.filter((fragment) => ["view", "pure"].includes(fragment.stateMutability));
        const writes = fragments.filter((fragment) => !["view", "pure"].includes(fragment.stateMutability));
        return {
          read: reads.length ? reads.map((fragment) => renderFunction(fragment, "read")).join("") : `<div class="empty">无读取函数</div>`,
          write: writes.length ? writes.map((fragment) => renderFunction(fragment, "write")).join("") : `<div class="empty">无写入函数</div>`
        };
      } finally {
        state.fragments = previousFragments;
        state.decodedSignature = previousDecodedSignature;
      }
    }

    function cacheFunctionRender(fragments, decodedSignature = "") {
      const key = functionRenderKey(fragments, decodedSignature);
      if (!state.functionRenderCache.has(key)) {
        state.functionRenderCache.set(key, renderFunctionHtml(fragments, decodedSignature));
      }
      return state.functionRenderCache.get(key);
    }

    function renderFunctions() {
      const key = functionRenderKey();
      const cached = state.functionRenderCache.get(key) || cacheFunctionRender(state.fragments, state.decodedSignature);
      els.readFunctions.innerHTML = cached.read;
      els.writeFunctions.innerHTML = cached.write;
    }

    function renderFunction(fragment, mode) {
      const sig = fragment.format("sighash");
      const isOrigin = state.decodedSignature === sig;
      const params = fragment.inputs.map((param, index) => {
        const name = param.name || `arg${index + 1}`;
        const typeLabel = param.format ? param.format("sighash") : param.type;
        const placeholder = typeLabel.includes("[") || typeLabel.startsWith("tuple") ? "JSON" : "";
        return `
          <div class="field">
            <label class="param-label" for="${esc(mode)}-${esc(sig)}-${index}">
              <span>${esc(name)}</span>
              <span>${esc(typeLabel)}</span>
            </label>
            <input id="${esc(mode)}-${esc(sig)}-${index}" data-param-index="${index}" spellcheck="false" placeholder="${esc(placeholder)}" />
          </div>
        `;
      }).join("");

      const payableInput = mode === "write" && fragment.stateMutability === "payable" ? `
        <div class="field">
          <label for="${esc(mode)}-${esc(sig)}-value">${esc(currentNetwork().nativeCurrency.symbol)}</label>
          <input id="${esc(mode)}-${esc(sig)}-value" data-payable-value inputmode="decimal" placeholder="0" />
        </div>
      ` : "";

      const actions = mode === "read"
        ? `<button class="primary" data-read="${esc(sig)}">读取</button>`
        : `<button class="ghost" data-estimate="${esc(sig)}">估算</button><button class="danger" data-write="${esc(sig)}">发送</button>`;

      return `
        <div class="function-item ${isOrigin ? "original-call" : ""}" data-function="${esc(sig)}">
          <div class="function-top">
            <div class="function-name">${esc(sig)}</div>
            <div class="row">
              ${isOrigin ? `<div class="function-kind origin">原交易</div>` : ""}
              <div class="function-kind ${mode === "write" ? "write" : ""}">${mode === "read" ? "read" : fragment.stateMutability}</div>
            </div>
          </div>
          <div class="function-body">
            <div class="params">${params || `<div class="empty">无参数</div>`}${payableInput}</div>
            <div class="row">${actions}</div>
            <div class="result" data-result-for="${esc(sig)}">-</div>
          </div>
        </div>
      `;
    }

    function parseParamValue(raw, param) {
      const value = raw.trim();
      const type = param.format ? param.format("sighash") : param.type;
      if (!value && type !== "string") throw new Error(`${param.name || type} 不能为空。`);
      if (type === "string") return raw;
      if (type === "bool") {
        if (/^(true|1)$/i.test(value)) return true;
        if (/^(false|0)$/i.test(value)) return false;
        throw new Error(`${param.name || type} 需要 bool。`);
      }
      if (/^u?int/.test(type)) return value;
      if (type === "address") return validateAddress(value);
      if (type.startsWith("bytes")) return value;
      if (type.includes("[") || type.startsWith("tuple") || type.includes("(")) return JSON.parse(value);
      return value;
    }

    function functionContainer(signature) {
      return document.querySelector(`.function-item[data-function="${CSS.escape(signature)}"]`);
    }

    function collectArgs(signature) {
      const fragment = state.iface.getFunction(signature);
      const container = functionContainer(signature);
      const inputs = [...container.querySelectorAll("[data-param-index]")];
      return fragment.inputs.map((param, index) => parseParamValue(inputs[index]?.value || "", param));
    }

    function resultBox(signature) {
      return document.querySelector(`[data-result-for="${CSS.escape(signature)}"]`);
    }

    function valueForInput(value) {
      const normalized = normalizeValue(value);
      if (Array.isArray(normalized) || (normalized && typeof normalized === "object")) {
        return JSON.stringify(normalized);
      }
      return String(normalized ?? "");
    }

    function showFunctionTab(signature) {
      if (!state.iface) return;
      const fragment = state.iface.getFunction(signature);
      const isRead = ["view", "pure"].includes(fragment.stateMutability);
      const tab = document.querySelector(`.tab[data-tab="${isRead ? "readPanel" : "writePanel"}"]`);
      if (tab) activateTab(tab);
    }

    function jumpToFunctionCard(signature) {
      showFunctionTab(signature);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => centerFunctionCard(signature, "smooth"));
      });
      setTimeout(() => centerFunctionCard(signature, "smooth"), 50);
      setTimeout(() => centerFunctionCard(signature, "smooth"), 140);
    }

    function centerFunctionCard(signature, behavior = "smooth") {
      const container = functionContainer(signature);
      if (!container) return;
      const rect = container.getBoundingClientRect();
      const targetTop = window.scrollY + rect.top + (rect.height / 2) - (window.innerHeight / 2);
      const maxTop = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      window.scrollTo({
        top: Math.min(maxTop, Math.max(0, targetTop)),
        behavior
      });
    }

    function fillOriginalCallInputs(signature, parsed, { scroll = false } = {}) {
      const container = functionContainer(signature);
      if (!container) return;
      const inputs = [...container.querySelectorAll("[data-param-index]")];
      parsed.fragment.inputs.forEach((param, index) => {
        if (inputs[index]) inputs[index].value = valueForInput(parsed.args[index]);
      });
      const payableInput = container.querySelector("[data-payable-value]");
      if (payableInput && parsed.value && parsed.value > 0n) {
        payableInput.value = window.ethers.formatEther(parsed.value);
      }
      const box = resultBox(signature);
      if (box) box.textContent = "已填入原交易参数。发送前请先估算并确认。";
      if (scroll) container.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function fillFunctionInputs(signature, values, payableValue = "") {
      const container = functionContainer(signature);
      if (!container) return;
      const inputs = [...container.querySelectorAll("[data-param-index]")];
      values.forEach((value, index) => {
        if (inputs[index]) inputs[index].value = valueForInput(value);
      });
      const payableInput = container.querySelector("[data-payable-value]");
      if (payableInput) payableInput.value = payableValue;
      const box = resultBox(signature);
      if (box) box.textContent = "已按输入数量自动配置参数。";
    }

    function smartDetectResult(parsed) {
      const signature = parsed.fragment.format("sighash");
      return {
        "识别函数": signature,
        "函数名称": parsed.name,
        "参数": normalizeValue(parsed.args),
        "下一步": "已填入对应函数参数；如需操作，可手动打开写入函数页查看。"
      };
    }

    function ensureRouterAbi(functionName) {
      try {
        if (state.iface) state.iface.getFunction(functionName);
      } catch (error) {
        applyRouterMinimalAbi();
      }
      if (!state.iface) applyRouterMinimalAbi();
    }

    function applyRouterMinimalAbi() {
      useAbiPayload(ROUTER_ABI, "Router 最小 ABI");
      state.abiIsRouterMinimal = true;
    }

    function prewarmRouterFunctionCache() {
      try {
        const { ethers } = requireEthers();
        const iface = new ethers.Interface(ROUTER_ABI);
        const fragments = iface.fragments.filter((fragment) => fragment.type === "function");
        cacheFunctionRender(fragments, "");
        return true;
      } catch (error) {
        return false;
      }
    }

    function scheduleRouterPrewarm(attempt = 0) {
      if (prewarmRouterFunctionCache()) return;
      if (attempt < 30) {
        setTimeout(() => scheduleRouterPrewarm(attempt + 1), 100);
      }
    }

    function renderSignatureHints(selector, results) {
      if (!results.length) {
        els.signatureHints.innerHTML = `<div class="empty">没有找到 selector ${esc(selector)} 的公开签名候选</div>`;
        return;
      }
      els.signatureHints.innerHTML = results.slice(0, 6).map((item) => `
        <div class="hint-item">
          <strong>${esc(item.text_signature)}</strong>
          <span class="chip">${esc(selector)}</span>
        </div>
      `).join("");
    }

    async function lookupSelector() {
      try {
        if (!state.tx) await loadTransaction();
        if (!state.tx?.data || state.tx.data === "0x") {
          setAdvisor("这笔交易没有 calldata，无法查询函数签名。", "warn", "无 calldata");
          return;
        }
        const selector = state.tx.data.slice(0, 10);
        setAdvisor(`正在查询 ${selector} 的函数签名候选...`, "", "查询中");
        els.lookupSelectorBtn.disabled = true;
        const response = await fetch(`https://www.4byte.directory/api/v1/signatures/?hex_signature=${selector}`);
        if (!response.ok) throw new Error(`4byte 查询失败：${response.status}`);
        const data = await response.json();
        const results = Array.isArray(data.results) ? data.results : [];
        renderSignatureHints(selector, results);
        setAdvisor(results.length ? "已找到函数签名候选；如果没有公开 ABI，只能把它当作参考。" : "没有找到公开函数签名候选。", results.length ? "good" : "warn", results.length ? "有候选" : "无候选");
      } catch (error) {
        setAdvisor(error.message, "bad", "查询失败");
      } finally {
        els.lookupSelectorBtn.disabled = false;
      }
    }

    async function smartDetectCall() {
      try {
        requireEthers();
        els.smartDetectBtn.disabled = true;
        setAdvisor("正在识别交易调用...", "", "识别中");
        els.signatureHints.innerHTML = "";
        if (!state.tx) await loadTransaction();
        if (!state.tx) throw new Error("请先解析交易哈希。");
        if (!state.tx.data || state.tx.data === "0x") {
          setAdvisor("这笔交易没有 calldata，不需要 ABI 解码。", "warn", "无 calldata");
          els.simpleSwapResult.textContent = "这笔交易没有 calldata，不需要 ABI 解码。";
          return;
        }

        if (!state.iface || state.abiIsRouterMinimal) {
          const loaded = await loadVerifiedAbi();
          if (!loaded) {
            await lookupSelector();
            els.simpleSwapResult.textContent = stringifyValue({
              "识别结果": "未找到公开 ABI",
              "selector": selectorFromData(state.tx.data),
              "下一步": "请根据下方 selector 候选确认函数，或粘贴正确 ABI 后再次智能识别。"
            });
            setAdvisor("未找到公开 ABI；已改用函数签名候选。", "warn", "ABI 未找到");
            return;
          }
        }

        decodeTransaction();
        if (state.decodedSignature) {
          setAdvisor(`原交易调用的是 ${state.decodedSignature}，参数已填入对应函数卡片。`, "good", "已识别");
          setMain("智能识别完成。", "good");
        } else {
          await lookupSelector();
          setAdvisor("ABI 已载入，但没有匹配到原交易 calldata。", "warn", "需确认");
          els.simpleSwapResult.textContent = "ABI 已载入，但没有匹配到原交易 calldata。";
        }
      } catch (error) {
        els.simpleSwapResult.textContent = error.message;
        setAdvisor(error.message, "bad", "识别失败");
        setMain(error.message, "bad");
      } finally {
        els.smartDetectBtn.disabled = false;
      }
    }

    function knownRouterInterface() {
      const { ethers } = requireEthers();
      return new ethers.Interface(ROUTER_ABI);
    }

    function currentCallData() {
      const raw = els.rawData.value.trim();
      return raw && raw !== "0x" ? raw : state.tx?.data || "";
    }

    function parseKnownRouterCall() {
      const data = currentCallData();
      if (!data || data === "0x") throw new Error("当前没有可诊断的 calldata。");
      let parsed = null;
      try {
        parsed = knownRouterInterface().parseTransaction({ data });
      } catch (error) {
        throw new Error(unsupportedAggregatorMessage(data));
      }
      if (!parsed) throw new Error(unsupportedAggregatorMessage(data));
      return parsed;
    }

    function tryParseRouterCallFromData(data) {
      try {
        if (!data || data === "0x") return null;
        return knownRouterInterface().parseTransaction({ data });
      } catch (error) {
        return null;
      }
    }

    async function requireCurrentWalletRecipientForRaw() {
      const data = els.rawData.value.trim();
      const parsed = tryParseRouterCallFromData(data);
      if (!parsed) return;
      const wallet = selectedWalletProvider();
      const account = state.account || (await wallet.request?.({ method: "eth_accounts" }))?.[0] || "";
      if (!account) return;
      const need = routerTransferNeed(parsed);
      if (!need.recipient) return;
      const recipient = validateAddress(need.recipient);
      const current = validateAddress(account);
      if (recipient.toLowerCase() === current.toLowerCase()) return;
      const message = `当前 Raw calldata 的输出接收地址是 ${recipient}，不是当前钱包 ${current}。请先在“输入数量”里填数量，然后点“按数量自动配置”或“配置并估算”。`;
      els.rawResult.textContent = message;
      setAdvisor(message, "bad", "旧 Raw 参数");
      throw new Error(message);
    }

    function routerTransferNeed(parsed) {
      const args = parsed.args;
      if (parsed.name === "exactInputSingle") {
        const params = args[0];
        return {
          routerKind: "v3",
          name: parsed.name,
          signature: parsed.fragment.format("sighash"),
          amount: params.amountIn,
          amountOutMin: params.amountOutMinimum,
          amountLabel: "amountIn",
          path: [params.tokenIn, params.tokenOut],
          recipient: params.recipient,
          v3Params: params
        };
      }
      if (parsed.name === "exactInput") {
        const params = args[0];
        return {
          routerKind: "v3",
          name: parsed.name,
          signature: parsed.fragment.format("sighash"),
          amount: params.amountIn,
          amountOutMin: params.amountOutMinimum,
          amountLabel: "amountIn",
          path: decodeV3PathTokens(params.path),
          recipient: params.recipient,
          v3Params: params
        };
      }
      if (parsed.name.startsWith("swapExactETH")) {
        return { routerKind: "v2", nativeInput: true, name: parsed.name, signature: parsed.fragment.format("sighash"), amountOutMin: args[0], path: Array.from(args[1]), recipient: args[2] };
      }
      if (parsed.name.startsWith("swapExactTokens")) {
        return {
          routerKind: "v2",
          name: parsed.name,
          signature: parsed.fragment.format("sighash"),
          amount: args[0],
          amountOutMin: args[1],
          amountLabel: "amountIn",
          path: Array.from(args[2]),
          recipient: args[3]
        };
      }
      if (parsed.name.startsWith("swapTokensForExact")) {
        return {
          routerKind: "v2",
          name: parsed.name,
          signature: parsed.fragment.format("sighash"),
          amount: args[1],
          amountOutMin: null,
          amountLabel: "amountInMax",
          path: Array.from(args[2]),
          recipient: args[3]
        };
      }
      throw new Error(`暂不支持诊断 ${parsed.name}。`);
    }

    function decodeV3PathTokens(pathValue) {
      const hex = String(pathValue || "").replace(/^0x/i, "");
      if (hex.length < 40) return [];
      const tokens = [];
      let offset = 0;
      while (offset + 40 <= hex.length) {
        tokens.push(`0x${hex.slice(offset, offset + 40)}`);
        offset += 46;
      }
      return tokens;
    }

    function aggregatorNameFromText(text) {
      const normalized = String(text || "").toLowerCase();
      return AGGREGATOR_HINTS.find((item) => item.keys.some((key) => normalized.includes(key)))?.name || "";
    }

    function unsupportedAggregatorMessage(data = currentCallData()) {
      const selector = data && data !== "0x" ? data.slice(0, 10) : "";
      const targetName = aggregatorNameFromText(`${els.targetAddress.value} ${els.abiStatus.textContent} ${els.decodeResult.textContent}`);
      const prefix = targetName ? `检测到这更像 ${targetName} 交易。` : "当前 calldata 不是已知的 V2/V3 直连 Router swap 函数。";
      return `${prefix} 聚合器交易不能只改旧哈希里的数量，需要从对应聚合器报价接口重新生成 to/data/value。selector: ${selector || "无"}`;
    }

    async function safeTokenRead(contract, method, fallback) {
      try {
        return await contract[method]();
      } catch (error) {
        return fallback;
      }
    }

    function fmtUnits(value, decimals) {
      const { ethers } = requireEthers();
      try {
        return ethers.formatUnits(value, decimals);
      } catch (error) {
        return value.toString();
      }
    }

    function simpleSlippageBps() {
      if (els.simpleSlippage.value === "custom") {
        const text = els.customSlippage.value.trim();
        const value = Number(text);
        if (!text || !Number.isFinite(value) || value < 0 || value > 90) {
          throw new Error("自定义滑点请输入 0 到 90 之间的百分比。");
        }
        return BigInt(Math.round(value * 100));
      }
      const value = BigInt(els.simpleSlippage.value || "1000");
      if (value < 0n || value > 9000n) return 1000n;
      return value;
    }

    function simpleSlippageLabel() {
      return `${Number(simpleSlippageBps()) / 100}%`;
    }

    function syncCustomSlippageUi() {
      els.customSlippage.hidden = els.simpleSlippage.value !== "custom";
    }

    function renderSwapDiagnosis(details) {
      const amount = `${fmtUnits(details.amount, details.decimals)} ${details.symbol}`;
      const balance = `${fmtUnits(details.balance, details.decimals)} ${details.symbol}`;
      const allowance = `${fmtUnits(details.allowance, details.decimals)} ${details.symbol}`;
      const balanceOk = details.balance >= details.amount;
      const allowanceOk = details.allowance >= details.amount;
      const recipientOk = details.recipient.toLowerCase() === details.account.toLowerCase();
      const issueText = [
        balanceOk ? "" : "输入代币余额不足",
        allowanceOk ? "" : "对 Router 的授权不足",
        recipientOk ? "" : "输出接收地址不是当前钱包"
      ].filter(Boolean).join("；") || "余额和授权都够，失败可能来自代币限制、池子状态或参数。";

      els.signatureHints.innerHTML = `
        <div class="hint-item"><strong>函数</strong><span>${esc(details.name)}</span></div>
        <div class="hint-item"><strong>输入代币</strong><span class="mono">${esc(details.token)}</span></div>
        <div class="hint-item"><strong>Router</strong><span class="mono">${esc(details.router)}</span></div>
        <div class="hint-item"><strong>输出接收</strong><span class="mono">${esc(details.recipient)} ${recipientOk ? "OK" : "不是当前钱包"}</span></div>
        <div class="hint-item"><strong>需要数量</strong><span>${esc(amount)}</span></div>
        <div class="hint-item"><strong>你的余额</strong><span>${esc(balance)} ${balanceOk ? "OK" : "不足"}</span></div>
        <div class="hint-item"><strong>已授权</strong><span>${esc(allowance)} ${allowanceOk ? "OK" : "不足"}</span></div>
        <div class="status-line ${balanceOk && allowanceOk ? "warn" : "bad"}">${esc(issueText)}</div>
        ${allowanceOk ? "" : `<button class="primary" data-approve-input-token>授权本次金额</button>`}
      `;
    }

    async function diagnoseSwapTransfer() {
      try {
        requireEthers();
        if (!state.target) await applyTarget();
        const router = validateAddress(state.target || els.targetAddress.value.trim());
        const wallet = selectedWalletProvider();
        const account = state.account || (await wallet.request?.({ method: "eth_accounts" }))?.[0] || "";
        if (!account) throw new Error("请先连接钱包，才能检查你的余额和授权。");

        els.diagnoseSwapBtn.disabled = true;
        setAdvisor("正在检查输入代币余额和 Router 授权...", "", "检查中");
        const parsed = parseKnownRouterCall();
        const need = routerTransferNeed(parsed);
        if (need.nativeInput) {
          setAdvisor(`${need.name} 使用 ${currentNetwork().nativeCurrency.symbol} 作为输入，不需要 ERC20 授权；这个错误可能不是余额/授权导致。`, "warn", "无需授权");
          return;
        }

        const token = validateAddress(need.path[0]);
        const erc20 = new window.ethers.Contract(token, ERC20_ABI, provider());
        const [symbolRaw, decimalsRaw, balance, allowance] = await Promise.all([
          safeTokenRead(erc20, "symbol", "TOKEN"),
          safeTokenRead(erc20, "decimals", 18),
          erc20.balanceOf(account),
          erc20.allowance(account, router)
        ]);
        const decimals = Number(decimalsRaw);
        const details = {
          name: need.name,
          token,
          router,
          account,
          amount: need.amount,
          amountLabel: need.amountLabel,
          recipient: validateAddress(need.recipient),
          symbol: String(symbolRaw || "TOKEN"),
          decimals: Number.isFinite(decimals) ? decimals : 18,
          balance,
          allowance
        };
        if (!els.simpleAmount.value.trim()) els.simpleAmount.value = fmtUnits(need.amount, details.decimals);
        els.approvalToken.value = details.token;
        els.approvalSpender.value = details.router;
        els.approvalAmount.value = fmtUnits(details.amount, details.decimals);
        els.approvalDecimals.value = String(details.decimals);
        state.swapDiagnosis = details;
        renderSwapDiagnosis(details);
        const balanceOk = balance >= need.amount;
        const allowanceOk = allowance >= need.amount;
        els.approvalState.textContent = allowanceOk ? "已有授权" : "需授权";
        els.approvalResult.textContent = stringifyValue({
          "代币地址": details.token,
          "授权对象": details.router,
          "钱包地址": validateAddress(account),
          "代币符号": details.symbol,
          "代币精度": details.decimals,
          "钱包余额": `${fmtUnits(details.balance, details.decimals)} ${details.symbol}`,
          "当前授权额度": `${fmtUnits(details.allowance, details.decimals)} ${details.symbol}`,
          "本次需要数量": `${fmtUnits(details.amount, details.decimals)} ${details.symbol}`,
          "余额是否足够": balanceOk ? "足够" : "不足",
          "授权是否足够": allowanceOk ? "足够" : "不足"
        });

        if (!balanceOk) {
          setAdvisor("输入代币余额不足。换成持有该代币的钱包，或减少 amountIn。", "bad", "余额不足");
        } else if (!allowanceOk) {
          setAdvisor("输入代币授权不足。可以先授权本次金额，再重新估算。", "bad", "需授权");
        } else if (details.recipient.toLowerCase() !== account.toLowerCase()) {
          setAdvisor("余额和授权够，但输出接收地址不是当前钱包；发送前请把 to 参数改成你的钱包地址。", "warn", "接收地址不一致");
        } else {
          setAdvisor("余额和授权都够；如果仍失败，检查代币交易限制、池子流动性、滑点和 deadline。", "warn", "需排查");
        }
      } catch (error) {
        setAdvisor(error.message, "bad", "检查失败");
        els.signatureHints.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
      } finally {
        els.diagnoseSwapBtn.disabled = false;
      }
    }

    async function approveInputToken() {
      try {
        requireEthers();
        const details = state.swapDiagnosis;
        if (!details) throw new Error("请先检查余额/授权。");
        if (!window.confirm(`确认授权 ${details.router} 使用 ${fmtUnits(details.amount, details.decimals)} ${details.symbol}？`)) return;
        const signer = await signerOnCurrentNetwork();
        const token = new window.ethers.Contract(details.token, ERC20_ABI, signer);
        setAdvisor("正在提交授权交易...", "", "授权中");
        const tx = await token.approve(details.router, details.amount);
        const link = explorerTxUrl(tx.hash);
        setLast({ approveTx: tx.hash, link });
        setAdvisor("授权交易已提交。等待链上确认后再重新估算 swap。", "good", "已提交授权");
        els.signatureHints.innerHTML += `<div class="hint-item"><strong>授权交易</strong><a href="${esc(link)}" target="_blank" rel="noopener">${esc(tx.hash)}</a></div>`;
      } catch (error) {
        setAdvisor(error.message, "bad", "授权失败");
      }
    }

    async function approvalContext() {
      requireEthers();
      const token = validateAddress(els.approvalToken.value.trim());
      const spender = validateAddress(els.approvalSpender.value.trim());
      const wallet = selectedWalletProvider();
      const account = state.account || (await wallet.request?.({ method: "eth_accounts" }))?.[0] || "";
      if (!account) throw new Error("请先连接钱包。");
      const readContract = new window.ethers.Contract(token, ERC20_ABI, provider());
      const [symbolRaw, decimalsRaw] = await Promise.all([
        safeTokenRead(readContract, "symbol", "TOKEN"),
        safeTokenRead(readContract, "decimals", 18)
      ]);
      const explicitDecimals = els.approvalDecimals.value.trim();
      const decimals = explicitDecimals ? Number(explicitDecimals) : Number(decimalsRaw);
      if (!Number.isFinite(decimals) || decimals < 0 || decimals > 255) throw new Error("Token 精度无效。");
      els.approvalDecimals.value = String(decimals);
      return { token, spender, account: validateAddress(account), symbol: String(symbolRaw || "TOKEN"), decimals, readContract };
    }

    function approvalAmountRaw(decimals) {
      const { ethers } = requireEthers();
      const amount = els.approvalAmount.value.trim();
      if (!amount || Number(amount) < 0) throw new Error("请填写授权数量。");
      return ethers.parseUnits(amount, decimals);
    }
