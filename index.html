<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>合约授权 / 撤销工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
.container{max-width:820px;margin:auto;background:#1c1c1c;border-radius:16px;padding:24px}
h1{text-align:center;margin-bottom:24px}
.section{margin-top:20px;padding:16px;border:1px solid #333;border-radius:12px}
label{display:block;margin-top:12px;font-weight:600}
input{width:100%;padding:10px;border-radius:8px;border:none;margin-top:6px;background:#2a2a2a;color:#fff}
button{cursor:pointer;border:none;border-radius:10px;padding:14px;font-size:16px;margin-top:14px}
.primary{background:#2ecc71;color:#000}
.danger{background:#e74c3c;color:#fff}
.wallet{background:#f7931a;color:#000}
.chain{display:flex;gap:10px}
.chain button{flex:1;background:#333}
.chain button.active{background:#2ecc71;color:#000}
.status{margin-top:16px;padding:12px;border-radius:10px;word-break:break-all}
.success{background:#27ae60}.error{background:#c0392b}.info{background:#2980b9}
code{font-size:12px}
</style>
</head>

<body>
<div class="container">
<h1>🔐 合约授权 / 撤销工具</h1>

<!-- 钱包 -->
<div class="section">
<button class="wallet" onclick="connect('okx')">🟠 欧易钱包</button>
<button class="wallet" onclick="connect('tp')">🔵 TP 钱包</button>
<div id="acc" style="margin-top:10px"></div>
</div>

<!-- 链 -->
<div class="section">
<div class="chain">
<button id="polygonBtn" onclick="switchChain('polygon')">Polygon</button>
<button id="anubisBtn" onclick="switchChain('anubis')">Anubis</button>
</div>
</div>

<!-- 表单 -->
<div class="section">
<label>代币合约地址</label>
<input id="token" value="0x8f3Cf7Ad23Cd3CaDbD9735AFf958023239c6A063" />

<label>被授权地址（Spender）</label>
<input id="spender" value="0x8ca97f41d2c81af050656e8ad0cf543820a24504" />

<button class="primary" onclick="approveToken()">✅ 授权</button>
<button class="danger" onclick="revokeToken()">❌ 撤销授权</button>
</div>

<div id="status" class="status" style="display:none"></div>
</div>

<script>
const chains = {
polygon:{
chainId:"0x89",
rpcUrls:["https://polygon-rpc.com"],
chainName:"Polygon"
},
anubis:{
chainId:"0x1A3A",
rpcUrls:["https://rpc2.anubispace.org"],
chainName:"Anubis"
}
};

let provider, account, currentChain="polygon";

/* 钱包 */
async function connect(type){
provider =
window.okxwallet ||
window.okxWallet ||
(window.ethereum?.providers?.find(p=>p.isOkx)) ||
(window.ethereum?.isOkx?window.ethereum:null) ||
window.ethereum;

if(!provider) return alert("未检测到钱包");
const acc = await provider.request({method:"eth_requestAccounts"});
account = acc[0];
document.getElementById("acc").innerText = "已连接：" + account;
}

/* 切链 */
async function switchChain(name){
currentChain = name;
const c = chains[name];
try{
await provider.request({method:"wallet_switchEthereumChain",params:[{chainId:c.chainId}]});
}catch{
await provider.request({method:"wallet_addEthereumChain",params:[c]});
}
updateUI();
}

function updateUI(){
document.getElementById("polygonBtn").className = currentChain==="polygon"?"chain button active":"chain button";
document.getElementById("anubisBtn").className = currentChain==="anubis"?"chain button active":"chain button";
}

/* 授权 */
async function approveToken(){
const token = val("token");
const spender = val("spender");

const data =
"0x095ea7b3" +
spender.slice(2).padStart(40,"0") +
"ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";

await sendTx(token,data,"授权");
}

/* 撤销（与你链上完全一致） */
async function revokeToken(){
const token = val("token");
const spender = val("spender");

/* 先查 allowance */
const allowanceData =
"0xdd62ed3e" +
account.slice(2).padStart(64,"0") +
spender.slice(2).padStart(64,"0");

const allowance = BigInt(await provider.request({
method:"eth_call",
params:[{to:token,data:allowanceData},"latest"]
}));

if(allowance===0n){
show("✅ 当前授权已是 0","success");
return;
}

const data =
"0x095ea7b3" +
spender.slice(2).padStart(40,"0") +
"0".padStart(64,"0");

await sendTx(token,data,"撤销授权");
}

/* 发交易 */
async function sendTx(to,data,msg){
try{
const tx = await provider.request({
method:"eth_sendTransaction",
params:[{from:account,to,data,gas:"0x7a120"}]
});
show(`✅ ${msg}成功<br><code>${tx}</code>`,"success");
}catch(e){
show("❌ 失败："+e.message,"error");
}
}

function val(id){return document.getElementById(id).value;}
function show(t,c){const s=document.getElementById("status");s.innerHTML=t;s.className="status "+c;s.style.display="block";}
updateUI();
</script>
</body>
</html>
