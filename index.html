    async function fillApprovalFromSwap() {
      try {
        const parsed = parseKnownRouterCall();
        const need = routerTransferNeed(parsed);
        if (need.nativeInput) throw new Error(`这个 swap 使用 ${currentNetwork().nativeCurrency.symbol} 输入，不需要 ERC20 授权。`);
        const token = validateAddress(need.path[0]);
        const spender = validateAddress(state.target || els.targetAddress.value.trim());
        const meta = await tokenMeta(token);
        els.approvalToken.value = token;
        els.approvalSpender.value = spender;
        els.approvalAmount.value = fmtUnits(need.amount, meta.decimals);
        els.approvalDecimals.value = String(meta.decimals);
        els.approvalResult.textContent = `已填入当前 swap 的输入代币 ${meta.symbol} 和 Router。`;
        els.approvalState.textContent = "已填入";
      } catch (error) {
        els.approvalResult.textContent = error.message;
        els.approvalState.textContent = "填入失败";
      }
    }

    function exactInputSwapName(need) {
      if (need.routerKind === "v3") return need.name;
      const originalName = need.name;
      if (originalName.startsWith("swapExact")) return originalName;
      if (originalName === "swapTokensForExactETH") return "swapExactTokensForETHSupportingFeeOnTransferTokens";
      return "swapExactTokensForTokensSupportingFeeOnTransferTokens";
    }

    function hasParam(params, name) {
      return Object.prototype.hasOwnProperty.call(params, name) || params[name] !== undefined;
    }

    function buildSwapArgs(need, amountIn, amountOutMin, path, account, deadline) {
      if (need.routerKind === "v3" && need.name === "exactInputSingle") {
        const params = need.v3Params;
        const next = hasParam(params, "deadline")
          ? [path[0], path[path.length - 1], params.fee, account, deadline, amountIn, amountOutMin, params.sqrtPriceLimitX96]
          : [path[0], path[path.length - 1], params.fee, account, amountIn, amountOutMin, params.sqrtPriceLimitX96];
        return [next];
      }
      if (need.routerKind === "v3" && need.name === "exactInput") {
        const params = need.v3Params;
        const next = hasParam(params, "deadline")
          ? [params.path, account, deadline, amountIn, amountOutMin]
          : [params.path, account, amountIn, amountOutMin];
        return [next];
      }
      if (need.nativeInput) return [amountOutMin, path, account, deadline];
      return [amountIn, amountOutMin, path, account, deadline];
    }

    async function tokenMeta(address) {
      const erc20 = new window.ethers.Contract(address, ERC20_ABI, provider());
      const [symbolRaw, decimalsRaw] = await Promise.all([
        safeTokenRead(erc20, "symbol", "TOKEN"),
        safeTokenRead(erc20, "decimals", 18)
      ]);
      const decimals = Number(decimalsRaw);
      return {
        symbol: String(symbolRaw || "TOKEN"),
        decimals: Number.isFinite(decimals) ? decimals : 18
      };
    }

    async function quotedAmountOutMin(router, path, amountIn, need) {
      const routerContract = new window.ethers.Contract(router, ROUTER_ABI, provider());
      try {
        const amounts = await routerContract.getAmountsOut(amountIn, path);
        const quotedOut = amounts[amounts.length - 1];
        const slippageBps = simpleSlippageBps();
        return {
          amountOutMin: quotedOut * (10000n - slippageBps) / 10000n,
          quotedOut,
          source: `Router 报价，自动留 ${simpleSlippageLabel()} 滑点`
        };
      } catch (error) {
        if (need.amount && need.amountOutMin && need.amount > 0n) {
          const scaled = need.amountOutMin * amountIn / need.amount;
          const slippageBps = simpleSlippageBps();
          return {
            amountOutMin: scaled * (10000n - slippageBps) / 10000n,
            quotedOut: scaled,
            source: `Router 报价失败，按原交易比例缩放并留 ${simpleSlippageLabel()} 滑点`
          };
        }
        return { amountOutMin: 0n, quotedOut: 0n, source: "Router 报价失败，amountOutMin 设为 0" };
      }
    }

    async function buildSimpleSwap({ estimate = false } = {}) {
      try {
        requireEthers();
        const { ethers } = window;
        const wallet = selectedWalletProvider();
        const account = state.account || (await wallet.request?.({ method: "eth_accounts" }))?.[0] || "";
        if (!account) throw new Error("请先连接钱包。");
        if (!state.tx && els.txHash.value.trim()) await loadTransaction();
        if (!state.target) await applyTarget();

        const amountText = els.simpleAmount.value.trim();
        if (!amountText || Number(amountText) <= 0) throw new Error("请填写输入数量。");

        els.buildSimpleSwapBtn.disabled = true;
        els.estimateSimpleSwapBtn.disabled = true;
        setAdvisor("正在按输入数量自动配置交易参数...", "", "配置中");

        const router = validateAddress(state.target || els.targetAddress.value.trim());
        const parsed = parseKnownRouterCall();
        const need = routerTransferNeed(parsed);
        const functionName = exactInputSwapName(need);
        const path = need.path.map(validateAddress);
        const deadline = BigInt(Math.floor(Date.now() / 1000) + SIMPLE_DEADLINE_SECONDS);
        const isNativeInput = functionName.startsWith("swapExactETH");
        const inputMeta = isNativeInput ? { symbol: currentNetwork().nativeCurrency.symbol, decimals: currentNetwork().nativeCurrency.decimals } : await tokenMeta(path[0]);
        const amountIn = ethers.parseUnits(amountText, inputMeta.decimals);
        const quote = await quotedAmountOutMin(router, path, amountIn, need);

        const args = buildSwapArgs(need, amountIn, quote.amountOutMin, path, validateAddress(account), deadline);
        const routerIface = knownRouterInterface();
        const encodeSignature = need.routerKind === "v3" ? need.signature : functionName;
        const data = routerIface.encodeFunctionData(encodeSignature, args);
        const outputMeta = functionName.includes("ForETH")
          ? { symbol: currentNetwork().nativeCurrency.symbol, decimals: currentNetwork().nativeCurrency.decimals }
          : await tokenMeta(path[path.length - 1]);

        state.target = router;
        els.targetAddress.value = router;
        els.rawData.value = data;
        els.rawValue.value = isNativeInput ? ethers.formatEther(amountIn) : "0";

        ensureRouterAbi(functionName);
        const signature = need.routerKind === "v3" ? need.signature : state.iface.getFunction(functionName).format("sighash");
        renderFunctions();
        fillFunctionInputs(signature, args, isNativeInput ? ethers.formatEther(amountIn) : "");
        if (estimate) {
          showFunctionTab(signature);
        } else {
          jumpToFunctionCard(signature);
        }

        els.simpleSwapResult.textContent = stringifyValue({
          "操作": estimate ? "自动配置并估算" : "只按输入数量自动配置",
          "调用函数": functionName,
          "输入数量": `${amountText} ${inputMeta.symbol}`,
          "预估输出": `${fmtUnits(quote.quotedOut, outputMeta.decimals)} ${outputMeta.symbol}`,
          "最少接收": `${fmtUnits(quote.amountOutMin, outputMeta.decimals)} ${outputMeta.symbol}`,
          "滑点保护": simpleSlippageLabel(),
          "接收地址": validateAddress(account),
          "截止时间": Number(deadline),
          "报价来源": quote.source
        });
        setAdvisor("已自动配置。接下来点检查余额/授权，确认通过后再估算。", "good", "已配置");

        if (estimate) {
          await diagnoseSwapTransfer();
          await estimateRaw();
        } else {
          setTimeout(async () => {
            await diagnoseSwapTransfer();
            centerFunctionCard(signature, "smooth");
          }, 160);
        }
      } catch (error) {
        els.simpleSwapResult.textContent = error.message;
        setAdvisor(error.message, "bad", "配置失败");
      } finally {
        els.buildSimpleSwapBtn.disabled = false;
        els.estimateSimpleSwapBtn.disabled = false;
      }
    }

    async function handleTransferFromFailure(error) {
      const message = `${error?.reason || ""} ${error?.shortMessage || ""} ${error?.message || ""}`;
      if (!message.includes("TRANSFER_FROM_FAILED")) return;
      setAdvisor("Router 拉取输入代币失败，通常是余额不足或未授权。正在尝试检查。", "bad", "TransferFrom 失败");
      await diagnoseSwapTransfer();
    }

    function handleInsufficientOutput(error) {
      const message = `${error?.reason || ""} ${error?.shortMessage || ""} ${error?.message || ""}`;
      if (!message.includes("INSUFFICIENT_OUTPUT_AMOUNT")) return false;
      const tip = "最少接收数量 amountOutMin 太高。请把“滑点保护”调到 20%；如果仍失败，用 50% 只做估算测试，然后重新点“自动配置并估算”。";
      setAdvisor(tip, "bad", "滑点太低");
      els.simpleSwapResult.textContent = tip;
      els.signatureHints.innerHTML = `<div class="status-line bad">${esc(tip)}</div>`;
      return true;
    }

    async function readFunction(signature) {
      try {
        requireEthers();
        const { ethers } = window;
        if (!state.target) await applyTarget();
        const args = collectArgs(signature);
        const contract = new ethers.Contract(state.target, state.abi, provider());
        const result = await contract.getFunction(signature)(...args);
        resultBox(signature).textContent = stringifyValue(result);
        setLast({ [signature]: normalizeValue(result) });
        setMain("读取完成。", "good");
      } catch (error) {
        resultBox(signature).textContent = error.message;
        setMain(error.message, "bad");
        handleInsufficientOutput(error);
        await handleTransferFromFailure(error);
      }
    }

    async function estimateFunction(signature) {
      try {
        requireEthers();
        const { ethers } = window;
        const signer = await signerOnCurrentNetwork();
        if (!state.target) await applyTarget();
        const args = collectArgs(signature);
        const fragment = state.iface.getFunction(signature);
        const overrides = {};
        const container = functionContainer(signature);
        const payableValue = container.querySelector("[data-payable-value]")?.value.trim();
        if (fragment.stateMutability === "payable" && payableValue) {
          overrides.value = ethers.parseEther(payableValue);
        }
        const contract = new ethers.Contract(state.target, state.abi, signer);
        const gas = await contract.getFunction(signature).estimateGas(...args, overrides);
        resultBox(signature).textContent = `${gas.toString()} gas`;
        setMain("估算完成。", "good");
      } catch (error) {
        resultBox(signature).textContent = error.message;
        setMain(error.message, "bad");
        handleInsufficientOutput(error);
        await handleTransferFromFailure(error);
      }
    }

    async function writeFunction(signature) {
      try {
        requireEthers();
        const { ethers } = window;
        const signer = await signerOnCurrentNetwork();
        if (!state.target) await applyTarget();
        const args = collectArgs(signature);
        const fragment = state.iface.getFunction(signature);
        const overrides = {};
        const container = functionContainer(signature);
        const payableValue = container.querySelector("[data-payable-value]")?.value.trim();
        if (fragment.stateMutability === "payable" && payableValue) {
          overrides.value = ethers.parseEther(payableValue);
        }
        if (!window.confirm(`确认发送到 ${state.target} 的链上交易？`)) return;
        const contract = new ethers.Contract(state.target, state.abi, signer);
        const tx = await contract.getFunction(signature)(...args, overrides);
        const link = explorerTxUrl(tx.hash);
        resultBox(signature).innerHTML = `已发送 ${esc(tx.hash)}\n${esc(link)}`;
        setLast({ hash: tx.hash, link });
        setMain("交易已提交。", "good");
      } catch (error) {
        resultBox(signature).textContent = error.message;
        setMain(error.message, "bad");
        handleInsufficientOutput(error);
        await handleTransferFromFailure(error);
      }
    }

    async function connectWallet() {
      try {
        requireEthers();
        syncDappIdentity();
        await new Promise((resolve) => setTimeout(resolve, 80));
        const wallet = selectedWalletProvider();
        try {
          await switchToCurrentNetwork();
        } catch (error) {
          // Some wallets require account permission before switching chains; retry after connecting.
        }
        const accounts = await wallet.request({ method: "eth_requestAccounts" });
        state.account = accounts[0] || "";
        const chainId = await wallet.request({ method: "eth_chainId" });
        state.chainId = chainId;
        bindSelectedWalletEvents();
        if (state.account && chainId !== currentNetwork().chainId) {
          await switchToCurrentNetwork();
        }
        updateWalletState();
        setMain(`钱包已连接，并同步到 ${currentNetwork().name}。`, "good");
      } catch (error) {
        setMain(error.message, "bad");
      }
    }

    async function disconnectWallet() {
      try {
        const wallet = state.walletProvider || selectedWalletProvider();
        let revoked = false;
        let revokeError = null;
        if (wallet?.request) {
          try {
            await wallet.request({
              method: "wallet_revokePermissions",
              params: [{ eth_accounts: {} }]
            });
            revoked = true;
          } catch (error) {
            revokeError = error;
          }
        }
        clearWalletConnection();
        if (revoked) {
          setMain("已断开网页和钱包插件的连接。再次连接时可重新选择账号。", "good");
        } else {
          const reason = revokeError?.message ? `（钱包未接受插件断开请求：${revokeError.message}）` : "";
          setMain(`网页连接已清除。这个钱包可能不支持网页主动断开插件授权，请在钱包插件里手动断开。${reason}`, "warn");
        }
      } catch (error) {
        setMain(error.message, "bad");
      }
    }

    async function switchToCurrentNetwork() {
      const network = currentNetwork();
      const wallet = selectedWalletProvider();
      try {
        await wallet.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: network.chainId }]
        });
      } catch (error) {
        if (error.code !== 4902) throw error;
        await wallet.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: network.chainId,
            chainName: network.chainName,
            nativeCurrency: network.nativeCurrency,
            rpcUrls: network.rpcPresets.map((item) => item.value),
            blockExplorerUrls: [network.explorerBase]
          }]
        });
      }
      state.chainId = await wallet.request({ method: "eth_chainId" });
      updateWalletState();
    }

    async function signerOnCurrentNetwork() {
      const { ethers } = requireEthers();
      const wallet = selectedWalletProvider();
      if (!state.account) await connectWallet();
      const chainId = await wallet.request({ method: "eth_chainId" });
      if (chainId !== currentNetwork().chainId) await switchToCurrentNetwork();
      const browserProvider = new ethers.BrowserProvider(wallet);
      return browserProvider.getSigner();
    }

    function updateWalletState() {
      if (!state.account) {
        els.walletDot.classList.remove("ok", "bad");
        els.walletState.textContent = "钱包未连接";
        els.connectWalletBtn.textContent = "连接钱包";
        els.disconnectWalletBtn.disabled = true;
        return;
      }
      const onCurrentNetwork = state.chainId === currentNetwork().chainId;
      els.walletDot.classList.toggle("ok", onCurrentNetwork);
      els.walletDot.classList.toggle("bad", !onCurrentNetwork);
      els.walletState.textContent = `${short(state.account)} ${onCurrentNetwork ? currentNetwork().name : `非 ${currentNetwork().name}`}`;
      els.connectWalletBtn.textContent = short(state.account);
      els.disconnectWalletBtn.disabled = false;
    }

    function clearWalletConnection() {
      state.account = "";
      state.chainId = "";
      updateWalletState();
    }

    function bindSelectedWalletEvents() {
      const wallet = state.walletProvider;
      if (!wallet || BOUND_WALLETS.has(wallet)) return;
      BOUND_WALLETS.add(wallet);
      wallet.on?.("accountsChanged", (accounts) => {
        if (!accounts?.[0]) {
          clearWalletConnection();
          setMain("钱包插件已断开，网页连接状态已同步清除。", "good");
          return;
        }
        state.account = accounts[0];
        updateWalletState();
      });
      wallet.on?.("chainChanged", (chainId) => {
        state.chainId = chainId;
        updateWalletState();
      });
    }

    function txOverridesFromRaw() {
      const { ethers } = requireEthers();
      const data = els.rawData.value.trim() || "0x";
      if (!/^0x([a-fA-F0-9]{2})*$/.test(data)) throw new Error("Calldata 必须是 hex。");
      const tx = { to: validateAddress(state.target || els.targetAddress.value.trim()), data };
      const value = els.rawValue.value.trim();
      if (value) tx.value = ethers.parseEther(value);
      const gas = els.rawGas.value.trim();
      if (gas) tx.gasLimit = BigInt(gas);
      return tx;
    }

    async function estimateRaw() {
      try {
        const signer = await signerOnCurrentNetwork();
        if (!state.target) await applyTarget();
        await requireCurrentWalletRecipientForRaw();
        const tx = txOverridesFromRaw();
        const gas = await signer.estimateGas(tx);
        els.rawResult.textContent = `${gas.toString()} gas`;
        setMain("Raw 估算完成。", "good");
      } catch (error) {
        els.rawResult.textContent = error.message;
        setMain(error.message, "bad");
        handleInsufficientOutput(error);
        await handleTransferFromFailure(error);
      }
    }

    async function sendRaw() {
      try {
        const signer = await signerOnCurrentNetwork();
        if (!state.target) await applyTarget();
        await requireCurrentWalletRecipientForRaw();
        const tx = txOverridesFromRaw();
        if (!window.confirm(`确认向 ${tx.to} 发送 Raw 交易？`)) return;
        const response = await signer.sendTransaction(tx);
        const link = explorerTxUrl(response.hash);
        els.rawResult.textContent = `已发送 ${response.hash}\n${link}`;
        setLast({ hash: response.hash, link });
        setMain("Raw 交易已提交。", "good");
      } catch (error) {
        els.rawResult.textContent = error.message;
        setMain(error.message, "bad");
        handleInsufficientOutput(error);
        await handleTransferFromFailure(error);
      }
    }

    function decodeTransaction() {
      if (!state.tx || !state.iface || !state.tx.data || state.tx.data === "0x") {
        els.decodeState.textContent = state.iface ? "无 calldata" : "未解码";
        els.decodeResult.textContent = "-";
        state.decodedSignature = "";
        state.decodedArgs = null;
        return;
      }
      try {
        const parsed = state.iface.parseTransaction({ data: state.tx.data, value: state.tx.value });
        if (!parsed) throw new Error("ABI 不匹配。");
        const signature = parsed.fragment.format("sighash");
        state.decodedSignature = signature;
        state.decodedArgs = parsed.args;
        renderFunctions();
        showFunctionTab(signature);
        fillOriginalCallInputs(signature, parsed);
        els.decodeState.textContent = signature;
        els.decodeResult.textContent = stringifyValue({
          name: parsed.name,
          signature,
          args: normalizeValue(parsed.args)
        });
        els.simpleSwapResult.textContent = stringifyValue(smartDetectResult(parsed));
        setAdvisor(`原交易调用的是 ${signature}，参数已填入。`, "good", "已解码");
      } catch (error) {
        state.decodedSignature = "";
        state.decodedArgs = null;
        els.decodeState.textContent = "ABI 不匹配";
        els.decodeResult.textContent = error.message;
      }
    }

    async function copyTarget() {
      try {
        const address = validateAddress(state.target || els.targetAddress.value.trim());
        await navigator.clipboard.writeText(address);
        setStatus(els.targetStatus, "地址已复制。", "good");
      } catch (error) {
        setStatus(els.targetStatus, error.message, "bad");
      }
    }

    function activateTab(button) {
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.remove("active"));
      button.classList.add("active");
      document.getElementById(button.dataset.tab).classList.add("active");
    }

    els.loadTxBtn.addEventListener("click", loadTransaction);
    els.networkModeBtn.addEventListener("click", async () => {
      els.networkModeBtn.disabled = true;
      try {
        await toggleNetworkMode();
      } finally {
        els.networkModeBtn.disabled = false;
      }
    });
    els.rpcPreset.addEventListener("change", selectRpcPreset);
    els.rpcUrl.addEventListener("change", () => {
      normalizedRpcUrl();
      els.rpcDot.classList.remove("ok", "bad");
      els.rpcState.textContent = "RPC 待连接";
    });
    els.walletSelect.addEventListener("change", () => {
      state.walletManuallySelected = true;
      state.walletProvider = state.wallets.find((wallet) => wallet.id === els.walletSelect.value)?.provider || null;
      state.account = "";
      state.chainId = "";
      bindSelectedWalletEvents();
      updateWalletState();
      setMain("已切换钱包入口，请重新连接钱包。", "warn");
    });
    els.applyTargetBtn.addEventListener("click", applyTarget);
    els.checkCodeBtn.addEventListener("click", () => checkTargetCode(true));
    els.copyTargetBtn.addEventListener("click", copyTarget);
    els.loadVerifiedAbiBtn.addEventListener("click", loadVerifiedAbi);
    els.smartDetectBtn.addEventListener("click", smartDetectCall);
    els.lookupSelectorBtn.addEventListener("click", lookupSelector);
    els.diagnoseSwapBtn.addEventListener("click", diagnoseSwapTransfer);
    els.buildSimpleSwapBtn.addEventListener("click", () => buildSimpleSwap());
    els.estimateSimpleSwapBtn.addEventListener("click", () => buildSimpleSwap({ estimate: true }));
    els.fillApprovalFromSwapBtn.addEventListener("click", fillApprovalFromSwap);
    els.checkApprovalBtn.addEventListener("click", checkApproval);
    els.approveTokenBtn.addEventListener("click", approveTokenAmount);
    els.revokeTokenBtn.addEventListener("click", revokeTokenApproval);
    els.simpleSlippage.addEventListener("change", () => {
      syncCustomSlippageUi();
      if (els.simpleSlippage.value === "custom" && !els.customSlippage.value.trim()) {
        setAdvisor("请输入自定义滑点百分比，然后重新点“自动配置并估算”。", "warn", "自定义滑点");
        return;
      }
      setAdvisor(`滑点已改为 ${simpleSlippageLabel()}，请重新点“自动配置并估算”。`, "warn", "需重新配置");
    });
    els.customSlippage.addEventListener("input", () => {
      if (els.simpleSlippage.value !== "custom") return;
      try {
        setAdvisor(`滑点已改为 ${simpleSlippageLabel()}，请重新点“自动配置并估算”。`, "warn", "需重新配置");
      } catch (error) {
        setAdvisor(error.message, "bad", "滑点无效");
      }
    });
    els.clearAbiBtn.addEventListener("click", clearAbi);
    els.useAbiBtn.addEventListener("click", usePastedAbi);
    els.connectWalletBtn.addEventListener("click", connectWallet);
    els.disconnectWalletBtn.addEventListener("click", disconnectWallet);
    els.resetPageBtn.addEventListener("click", () => {
      resetPageState();
      discoverWallets();
      bindSelectedWalletEvents();
      normalizedRpcUrl();
      setMain("已恢复默认状态。", "good");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    els.estimateRawBtn.addEventListener("click", estimateRaw);
    els.sendRawBtn.addEventListener("click", sendRaw);
    document.querySelectorAll(".tab").forEach((button) => button.addEventListener("click", () => activateTab(button)));
    document.addEventListener("click", (event) => {
      const read = event.target.closest("[data-read]");
      const estimate = event.target.closest("[data-estimate]");
      const write = event.target.closest("[data-write]");
      const approveInput = event.target.closest("[data-approve-input-token]");
      if (read) readFunction(read.dataset.read);
      if (estimate) estimateFunction(estimate.dataset.estimate);
      if (write) writeFunction(write.dataset.write);
      if (approveInput) approveInputToken();
    });
    els.txHash.addEventListener("keydown", (event) => {
      if (event.key === "Enter") loadTransaction();
    });

    state.networkKey = requestedNetworkKey();
    resetPageState();
    discoverWallets();
    bindSelectedWalletEvents();
    normalizedRpcUrl();
    scheduleRouterPrewarm();

    window.addEventListener("pageshow", (event) => {
      if (!event.persisted) return;
      state.networkKey = requestedNetworkKey();
      resetPageState();
      discoverWallets();
      bindSelectedWalletEvents();
      normalizedRpcUrl();
      scheduleRouterPrewarm();
    });

    const queryTx = new URLSearchParams(window.location.search).get("tx");
    if (queryTx) {
      els.txHash.value = queryTx;
      loadTransaction();
    }
  </script>
</body>
</html>
